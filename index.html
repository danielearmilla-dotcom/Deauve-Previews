<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEAUVE — Exclusive Previews</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="background" aria-hidden="true"></div>

  <main class="container">

    <header class="logo">
      <h1>DEAUVE</h1>
      <p>UNRELEASED MUSIC <span>PREVIEWS.</span></p>
    </header>

    <section class="tracks" aria-label="Vista previa de canciones">

      <!-- BOFETÁ -->
      <article class="song">
        <div class="song-top">
          <div class="song-info">
            <h2>BOFETÁ'</h2>
            <span class="time-display"><span class="current">0:00</span> / <span class="duration">0:00</span></span>
          </div>
          <button type="button" class="play" data-target="bofeta" aria-label="Reproducir BOFETÁ'">
            ▶
          </button>
        </div>

        <div class="progress" role="slider" aria-label="Progreso de BOFETÁ'" tabindex="0">
          <div class="progress-bar"></div>
        </div>

        <audio id="bofeta" preload="metadata">
          <source src="assets/BOFETA.m4a" type="audio/mp4">
        </audio>
      </article>

      <!-- DESDE HACE RATO -->
      <article class="song">
        <div class="song-top">
          <div class="song-info">
            <h2>DESDE HACE RATO</h2>
            <span class="time-display"><span class="current">0:00</span> / <span class="duration">0:00</span></span>
          </div>
          <button type="button" class="play" data-target="desde" aria-label="Reproducir DESDE HACE RATO">
            ▶
          </button>
        </div>

        <div class="progress" role="slider" aria-label="Progreso de DESDE HACE RATO" tabindex="0">
          <div class="progress-bar"></div>
        </div>

        <audio id="desde" preload="metadata">
          <source src="assets/DESDEHACERATO.m4a" type="audio/mp4">
        </audio>
      </article>

      <!-- TEMA 3 -->
      <article class="song">
        <div class="song-top">
          <div class="song-info">
            <h2>????????</h2>
            <span class="time-display"><span class="current">0:00</span> / <span class="duration">0:00</span></span>
          </div>
          <button type="button" class="play" data-target="tema3" aria-label="Reproducir Tema no disponible">
            ▶
          </button>
        </div>

        <div class="progress" role="slider" aria-label="Progreso del tema 3" tabindex="0">
          <div class="progress-bar"></div>
        </div>

        <audio id="tema3" preload="metadata">
          <source src="assets/TEMA3.m4a" type="audio/mp4">
        </audio>
      </article>

      <!-- PUTA BARETA -->
      <article class="song">
        <div class="song-top">
          <div class="song-info">
            <h2>PUTA BARETA</h2>
            <span class="time-display"><span class="current">0:00</span> / <span class="duration">0:00</span></span>
          </div>
          <button type="button" class="play" data-target="bareta" aria-label="Reproducir PUTA BARETA">
            ▶
          </button>
        </div>

        <div class="progress" role="slider" aria-label="Progreso de PUTA BARETA" tabindex="0">
          <div class="progress-bar"></div>
        </div>

        <audio id="bareta" preload="metadata">
          <source src="assets/PUTABARETA.m4a" type="audio/mp4">
        </audio>
      </article>

    </section>

    <div class="cta-container">
      <button type="button" class="soon" disabled>COMING SOON</button>
    </div>

    <footer>
      <p>© DEAUVE</p>
    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
